  <main>
    <p class="intro" id="js-intro"></p>

    <section id="publications">
      <div class="sec-head"><h2>Publications</h2><span class="count" id="js-pubcount"></span></div>
      <div class="tabs" id="js-tabs"></div>
      <div id="js-pubs"></div>
    </section>

    <section id="talks">
      <div class="sec-head"><h2>Talks</h2></div>
      <div id="js-talks"></div>
    </section>

    <section id="awards">
      <div class="sec-head"><h2>Awards &amp; Honors</h2></div>
      <div id="js-awards"></div>
    </section>

    <section id="experience">
      <div class="sec-head"><h2>Experience</h2></div>
      <div id="js-exp"></div>
    </section>

    <section id="education">
      <div class="sec-head"><h2>Education</h2></div>
      <div id="js-edu"></div>
    </section>

    <footer id="js-footer"></footer>
  </main>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const boldName = (s) => esc(s).split("Mengsay Loem").join("<b>Mengsay Loem</b>");
  const linksHTML = (links) => (links && links.length)
    ? '<div class="links">' + links.map(l => '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>').join("") + '</div>'
    : "";

  // header
  $("js-name").textContent = SITE.name;
  $("js-roles").innerHTML = SITE.roles.map(r => '<div class="role">'+esc(r)+'</div>').join("");
  $("js-tags").innerHTML = SITE.interests.map(t => '<span class="tag">'+esc(t)+'</span>').join("");
  $("js-intro").innerHTML = SITE.intro;
  $("js-footer").innerHTML = esc(SITE.email) + " &nbsp;·&nbsp; " + esc(SITE.location);

  const social = SITE.social.map(s => '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>').join("")
    + '<button id="js-copy" title="Copy email">Email</button>';
  $("js-social").innerHTML = social;
  $("js-copy").addEventListener("click", function(){
    const btn = this;
    const done = () => { btn.textContent="Copied ✓"; btn.classList.add("copied"); setTimeout(()=>{btn.textContent="Email"; btn.classList.remove("copied");},1600); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(SITE.email).then(done,done); }
    else { const ta=document.createElement("textarea"); ta.value=SITE.email; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta); done(); }
  });

  // publications + tabs
  const totalPubs = SITE.publications.reduce((n,c)=>n+c.items.length,0);
  $("js-pubcount").textContent = String(totalPubs).padStart(2,"0");

  function pubRow(it){
    return '<div class="row"><div class="gutter">'+esc(it.year)+'</div><div class="body">'
      + '<div class="title">'+esc(it.title)+'</div>'
      + '<div class="authors">'+boldName(it.authors)+'</div>'
      + '<div class="venue">'+esc(it.venue)+'</div>'
      + linksHTML(it.links) + '</div></div>';
  }
  function renderPubs(filter){
    const cats = filter==="all" ? SITE.publications : SITE.publications.filter(c=>c.key===filter);
    $("js-pubs").innerHTML = cats.map(c =>
      '<div class="cat"><div class="grouplabel">'+esc(c.label)+'</div>'+c.items.map(pubRow).join("")+'</div>'
    ).join("");
  }
  const tabDefs = [{key:"all",label:"All"}].concat(SITE.publications.map(c=>({key:c.key,label:c.tab||c.label})));
  $("js-tabs").innerHTML = tabDefs.map(t => '<button class="tab" data-key="'+t.key+'">'+esc(t.label)+'</button>').join("");
  const tabBtns = Array.from(document.querySelectorAll("#js-tabs .tab"));
  function setActive(key){ tabBtns.forEach(b=>b.classList.toggle("active", b.dataset.key===key)); renderPubs(key); }
  tabBtns.forEach(b => b.addEventListener("click", ()=>setActive(b.dataset.key)));
  setActive("all");

  // talks
  $("js-talks").innerHTML = SITE.talks.map(t =>
    '<div class="row"><div class="gutter wide">'+esc(t.date)+'</div><div class="body">'
    + '<div class="title">'+esc(t.title)+'</div><div class="exp-org">'+esc(t.venue)+'</div>'
    + linksHTML(t.links) + '</div></div>'
  ).join("");

  // awards
  $("js-awards").innerHTML = SITE.awards.map(a =>
    '<div class="row"><div class="gutter wide">'+esc(a.date)+'</div><div class="body">'
    + '<div class="plain-text">'+esc(a.text)+'</div>' + linksHTML(a.links) + '</div></div>'
  ).join("");

  // experience
  $("js-exp").innerHTML = SITE.experience.map(e =>
    '<div class="row"><div class="gutter xwide">'+esc(e.period)+'</div><div class="body">'
    + '<div class="exp-role">'+esc(e.role)+'</div><div class="exp-org">'+esc(e.org)+'</div></div></div>'
  ).join("");

  // education
  $("js-edu").innerHTML = SITE.education.map(e =>
    '<div class="row"><div class="gutter xwide">'+esc(e.period)+'</div><div class="body">'
    + '<div class="exp-role">'+esc(e.degree)+'</div><div class="exp-org">'+esc(e.org)+'</div></div></div>'
  ).join("");
</script>
</body>
</html>
