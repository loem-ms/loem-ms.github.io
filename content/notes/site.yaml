base_url: https://loem-ms.github.io
contact_email: mengsaylms@gmail.com
default_language: en

languages:
  en:
    label: EN
    html_lang: en
    notebook_kicker: Research notebook
    title: Notes
    description: >-
      A public notebook for paper-reading memos, research thoughts, and things
      I want to think through a little further. Mostly around NLP, AI,
      multilinguality, and evaluation.
    about_title: How these notes are made
    about_summary: >-
      Most notes start as GenAI-assisted drafts from roughly 10–20 turns of my
      own paper discussions. I review, revise, and make the final publication decision.
    about_more_label: Process details
    about:
      - >-
        For a typical paper, I use GenAI as a discussion partner to question
        interpretations, connect related work, and explore possible follow-up ideas
        from my own research interests and perspective.
      - >-
        The discussion log is then used to generate an initial draft. These notes
        are not raw model outputs or neutral paper summaries; the published version
        reflects my own interpretation, interests, and final editorial decisions.
    collaboration_title: Ideas are open invitations
    collaboration: >-
      Ideas at the end of notes are open invitations. Want to test one together?
      Contact me. Prefer to run with it yourself? Please do — and let me know what you find.
    search_placeholder: Search by title, summary, or tag
    all_years: All years
    no_results: No notes match these filters.
    all_notes: All Notes
    home: Home
  ja:
    label: 日本語
    html_lang: ja
    notebook_kicker: Research notebook
    title: Notes
    description: >-
      論文を読んで考えたこと、研究上のメモ、方法論についての気づき、
      まだ形になっていないアイデアなどを残すための公開ノートです。
      NLP・AI・多言語・評価あたりの話題を中心に書いていきます。
    about_title: このNotesについて
    about_summary: >-
      多くのNoteは、論文についてGenAIと10〜20ターンほど議論したログをもとに
      初稿を作り、私自身が確認・修正したうえで公開しています。
    about_more_label: 作成プロセスの詳細
    about:
      - >-
        1本の論文について、私自身の研究上の関心や視点から、解釈を問い直したり、
        関連研究との接続を考えたり、次のアイデアを探索したりするために、
        GenAIを議論相手として使っています。
      - >-
        その議論ログから初稿を生成しますが、ここにある文章は未レビューのAI出力でも、
        論文の中立的な要約でもありません。公開版には私自身の解釈・関心・問題意識と
        最終的な編集判断が反映されています。
    collaboration_title: 気になるアイデアがあれば、ぜひ一緒に
    collaboration: >-
      Noteの末尾には、そこから派生したアイデアや研究の方向性を置くことがあります。
      面白いと思うものがあり、一緒に実験や研究として進めてみたい方は、ぜひ連絡してください。
      もちろん、そのまま自分で試していただくのも歓迎です。何か面白い発見があれば、ぜひ教えてください。
    search_placeholder: タイトル・概要・タグで検索
    all_years: すべての年
    no_results: 条件に一致するNoteはありません。
    all_notes: すべてのNotes
    home: Home
