summary:
  en: >-
    A short note on romanized multilingual pretraining, why it improves cross-script
    transfer, and why the mechanism may be more complicated than lexical overlap alone.
  ja: >-
    Romanizationをpretrainingから使うとcross-script transferが強くなるという結果と、
    その理由をlexical overlapだけでは説明しきれないのでは、という短いメモ。
