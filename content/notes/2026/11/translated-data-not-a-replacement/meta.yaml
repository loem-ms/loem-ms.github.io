  ja: 翻訳データは代替ではない ― 評価の出自で結論が反転する

summary:
  en: >-
    A short note on MultiSynt/MT (EMNLP 2026): translated pretraining data beats native
    data on standard benchmarks, yet native data wins on native-authored tasks — so the
    ranking says as much about the origin of the evaluation as about the data.
  ja: >-
    MultiSynt/MT（EMNLP 2026）の短いメモ。翻訳データは標準ベンチマークではネイティブを上回るが、ネイティブ由来のタスクでは逆転する。順位はデータだけでなく評価の出自をも映している。
