summary:
  en: >-
    A short note on repetition mismatch in pre-training data-mixture experiments: why the
    best mixture at a small budget can change at the target budget, and how downsampling
    to preserve repetitions makes small experiments predictive again.
  ja: >-
    小規模なデータ混合実験が目標予算でずれる原因は繰り返し回数の不一致にあるという論文の短いメモで、繰り返しを保存するダウンサンプリングにより予測が戻ることを確認する。
