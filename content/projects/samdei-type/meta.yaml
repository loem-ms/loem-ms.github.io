title:
  en: Samdei Type
  ja: Samdei Type

summary:
  en: >-
    Open models that turn romanized Khmer, the Latin spelling many Cambodians
    use in chat, into Khmer script. Small enough for a phone keyboard, and
    released with all their training data and a new benchmark of everyday messages.
  ja: 多くのカンボジア人がチャットで使うローマ字表記のクメール語を、クメール文字に変換するオープンモデルです。スマホのキーボードに載る小ささで、学習データと日常メッセージの新しいベンチマークもすべて公開しました。

cover: assets/cover.jpg
cover_alt:
  en: "Samdei Type v0.1: knhom jong tov phsar becomes ខ្ញុំចង់ទៅផ្សារ. Samdei Type Mini, 7.1M parameters, for a phone keyboard; Samdei Type Base, 18.2M parameters."
  ja: "Samdei Type v0.1：knhom jong tov phsar が ខ្ញុំចង់ទៅផ្សារ になる。スマホのキーボード向けの Samdei Type Mini（7.1M パラメータ）と Samdei Type Base（18.2M パラメータ）。"

