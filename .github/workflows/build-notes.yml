name: Build Notes

on:
  push:
    branches:
      - gh-pages
    paths:
      - "content/notes/**"
      - "scripts/build_notes.py"
      - "requirements-notes.txt"
      - ".github/workflows/build-notes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Notes builder dependencies
        run: python -m pip install -r requirements-notes.txt

      - name: Build Notes
        run: python scripts/build_notes.py

      - name: Commit generated pages
        run: |
          if git diff --quiet -- notes; then
            echo "Notes output is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes
          git commit -m "Build Notes [skip ci]"
          git push
