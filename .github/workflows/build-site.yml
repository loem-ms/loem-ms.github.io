name: Build site

# Builds the generated sections (notes/ and projects/) from content/ and commits them.
on:
  push:
    branches:
      - gh-pages
    paths:
      - "content/**"
      - "scripts/build_notes.py"
      - "scripts/build_projects.py"
      - "requirements-notes.txt"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install builder dependencies
        run: python -m pip install -r requirements-notes.txt

      - name: Build Notes
        run: python scripts/build_notes.py

      - name: Build Projects
        run: python scripts/build_projects.py

      - name: Commit generated pages
        run: |
          git add notes projects
          if git diff --cached --quiet; then
            echo "Generated pages are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build site [skip ci]"
          git push
